name: tests

on:
  push:                    # qualquer branch: o resultado aparece antes do PR
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  MPLBACKEND: Agg          # sem janela: os gráficos só existem em memória
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  pytest:
    name: pytest (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          # Windows é onde o autor roda; mínimo e máximo bastam
          - os: windows-latest
            python: "3.10"
          - os: windows-latest
            python: "3.14"
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Instalar
        run: python -m pip install -e ".[dev]"

      - name: pytest
        shell: bash
        # Cada teste que falha vira uma anotação, visível no resumo do PR
        run: |
          set -o pipefail
          python -m pytest -q -rfE --tb=short | tee "$RUNNER_TEMP/pytest.log" || {
            grep -E "^(FAILED|ERROR) " "$RUNNER_TEMP/pytest.log" | sed 's/^/::error title=pytest::/'
            exit 1
          }

      - name: Dados sintéticos reproduzíveis
        # O gerador tem semente fixa: regenerar precisa dar os mesmos bytes
        # que estão versionados, em qualquer sistema.
        shell: bash
        run: |
          python examples/make_synthetic_data.py
          git diff --exit-code --stat examples/data

      - name: braggflow process no exemplo
        shell: bash
        run: braggflow process examples/data/synthetic_interrogator.asc --no-plot --data-dir "$RUNNER_TEMP/data"

  minimum-versions:
    # As versões mínimas declaradas no pyproject.toml precisam funcionar de fato
    name: pytest (versões mínimas das dependências)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Instalar com as versões mínimas
        run: |
          python -m pip install "numpy==1.24.*" "pandas==2.0.*" "scipy==1.10.*" \
            "matplotlib==3.7.*" "plotly==5.0.*" "flask==2.3.*" "pytest==7.*"
          python -m pip install --no-deps -e .

      - name: pytest
        shell: bash
        # Cada teste que falha vira uma anotação, visível no resumo do PR
        run: |
          set -o pipefail
          python -m pytest -q -rfE --tb=short | tee "$RUNNER_TEMP/pytest.log" || {
            grep -E "^(FAILED|ERROR) " "$RUNNER_TEMP/pytest.log" | sed 's/^/::error title=pytest::/'
            exit 1
          }

  browser:
    # Fluxos da interface num Chromium de verdade (tests/e2e)
    name: navegador (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Instalar
        run: |
          python -m pip install -e ".[dev,e2e]"
          python -m playwright install --with-deps chromium

      - name: pytest tests/e2e
        shell: bash
        run: |
          set -o pipefail
          python -m pytest tests/e2e -q -rfE --tb=short --tracing retain-on-failure \
            | tee "$RUNNER_TEMP/pytest.log" || {
            grep -E "^(FAILED|ERROR) " "$RUNNER_TEMP/pytest.log" | sed 's/^/::error title=navegador::/'
            exit 1
          }

      - name: Guardar o rastro dos testes que falharam
        # Abra com: playwright show-trace trace.zip (ou em trace.playwright.dev)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7

  quick-start:
    # Os comandos do quick start do README, como estão escritos, num sistema
    # limpo de cada tipo: o README quebrava fora do computador do autor
    name: quick start do README (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Comandos do README
        shell: python
        run: |
          # Roda os comandos do quick start do README, como estão escritos, a partir do
          # clone (pula o git clone e o cd) e confere que a página responde.
          import os, re, signal, subprocess, sys, time, urllib.request
          from pathlib import Path

          texto = Path("README.md").read_text(encoding="utf-8")
          bloco = "bat" if sys.platform == "win32" else "bash"
          secao = texto.split("## Quick start", 1)[1].split("\n## ", 1)[0]
          linhas = re.search(rf"```{bloco}\n(.*?)```", secao, re.S).group(1).strip().splitlines()
          assert linhas[0].startswith("git clone") and linhas[1] == "cd BraggFlow", linhas
          *passos, iniciar = linhas[2:]
          for passo in passos:
              print(">", passo, flush=True)
              subprocess.run(passo, shell=True, check=True)
          print(">", iniciar, flush=True)
          servidor = subprocess.Popen(iniciar + " --no-browser", shell=True, stdout=subprocess.PIPE, text=True, encoding="utf-8", errors="replace",
                                      start_new_session=sys.platform != "win32")
          try:
              url = None
              for linha in servidor.stdout:
                  print(linha, end="", flush=True)
                  achado = re.search(r"http://127\.0\.0\.1:\d+", linha)
                  if achado:
                      url = achado.group(0)
                      break
              assert url, "o servidor não disse onde escuta"
              for _ in range(60):
                  try:
                      with urllib.request.urlopen(url, timeout=5) as r:
                          assert r.status == 200 and b"BraggFlow" in r.read()
                          print("ok:", url, flush=True)
                          break
                  except OSError:
                      time.sleep(1)
              else:
                  raise SystemExit("a página não respondeu")
          finally:
              if sys.platform == "win32":
                  subprocess.run(["taskkill", "/F", "/T", "/PID", str(servidor.pid)], capture_output=True)
              else:
                  os.killpg(servidor.pid, signal.SIGTERM)
